# Application properties for CRAM Generator

# Server configuration
server.port=8080
server.servlet.context-path=/

# Application info
spring.application.name=CRAM Generator
info.app.name=CRAM Generator
info.app.version=1.0.0
info.app.description=Deep Learning Toolkit for CRAM Molecule Generation

# Logging
logging.level.root=INFO
logging.level.com.cram.generator=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# CORS
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS

# Jackson
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null
